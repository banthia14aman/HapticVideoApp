<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-label="Haptic editor screenshot mockup">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1A1B1E"/>
      <stop offset="1" stop-color="#121315"/>
    </linearGradient>
    <linearGradient id="monitor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="violetBtn" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#A879FF"/>
      <stop offset="1" stop-color="#7044E0"/>
    </linearGradient>
    <linearGradient id="violetEvent" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#A879FF"/>
      <stop offset="1" stop-color="#7044E0"/>
    </linearGradient>
    <linearGradient id="orangeEvent" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFB07A"/>
      <stop offset="1" stop-color="#FF8A4C"/>
    </linearGradient>
    <linearGradient id="cyanEvent" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7FD2FF"/>
      <stop offset="1" stop-color="#3FB0F5"/>
    </linearGradient>
    <linearGradient id="filmStrip" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset=".25" stop-color="#374151"/>
      <stop offset=".5" stop-color="#1F2937"/>
      <stop offset=".75" stop-color="#475569"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowViolet">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#8C5CFF" flood-opacity=".6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Phone background -->
  <rect width="390" height="844" rx="48" fill="url(#bg)"/>

  <!-- Status bar -->
  <g fill="#EDEDF0" font-family="-apple-system, SF Pro Display, Segoe UI, sans-serif" font-size="13" font-weight="600">
    <text x="32" y="34">9:41</text>
    <g transform="translate(310 22)" fill="#EDEDF0">
      <rect x="0" y="2" width="16" height="10" rx="2" fill="none" stroke="#EDEDF0" stroke-width="1"/>
      <rect x="2" y="4" width="10" height="6" rx="1"/>
      <circle cx="28" cy="7" r="3" fill="none" stroke="#EDEDF0" stroke-width="1"/>
      <path d="M40 10 q4 -8 12 -8" stroke="#EDEDF0" stroke-width="1.4" fill="none"/>
    </g>
  </g>

  <!-- Top bar -->
  <g transform="translate(0 56)">
    <rect width="390" height="48" fill="#1A1B1E"/>
    <rect y="47" width="390" height="1" fill="rgba(255,255,255,.06)"/>

    <!-- back -->
    <rect x="12" y="8" width="32" height="32" rx="8" fill="#2C2D31"/>
    <path d="M27 16 l-6 8 6 8" stroke="#9A9BA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- title -->
    <text x="54" y="22" fill="#EDEDF0" font-family="-apple-system, SF Pro Display, Segoe UI, sans-serif" font-size="13" font-weight="600">Haptic Editor</text>
    <text x="54" y="36" fill="#6B6C72" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10">12 events  •  0:24</text>

    <!-- undo/redo -->
    <rect x="244" y="8" width="32" height="32" rx="8" fill="#2C2D31" opacity=".5"/>
    <path d="M256 16 l-5 8 5 8 m-5 -8 h14" stroke="#9A9BA1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
    <rect x="284" y="8" width="32" height="32" rx="8" fill="#2C2D31" opacity=".5"/>
    <path d="M304 16 l5 8 -5 8 m5 -8 h-14" stroke="#9A9BA1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>

    <!-- Done -->
    <rect x="324" y="8" width="54" height="32" rx="8" fill="url(#violetBtn)"/>
    <text x="351" y="29" text-anchor="middle" fill="#fff" font-family="-apple-system, SF Pro Display, Segoe UI, sans-serif" font-size="13" font-weight="600">Done</text>
  </g>

  <!-- Video monitor -->
  <g transform="translate(0 104)">
    <rect width="390" height="200" fill="#1A1B1E"/>
    <rect x="16" y="10" width="358" height="180" rx="6" fill="url(#monitor)"/>
    <!-- skyline silhouette -->
    <g opacity=".6">
      <rect x="40" y="120" width="20" height="60" fill="#0F1F33"/>
      <rect x="70" y="100" width="18" height="80" fill="#0F1F33"/>
      <rect x="92" y="130" width="22" height="50" fill="#0F1F33"/>
      <rect x="120" y="80" width="16" height="100" fill="#0B1828"/>
      <rect x="140" y="105" width="20" height="75" fill="#0B1828"/>
      <rect x="166" y="90" width="14" height="90" fill="#0B1828"/>
      <rect x="184" y="115" width="22" height="65" fill="#0F1F33"/>
      <rect x="214" y="70" width="18" height="110" fill="#091422"/>
      <rect x="238" y="95" width="16" height="85" fill="#0B1828"/>
      <rect x="260" y="118" width="20" height="62" fill="#0F1F33"/>
      <rect x="286" y="98" width="18" height="82" fill="#0B1828"/>
      <rect x="310" y="125" width="22" height="55" fill="#0F1F33"/>
    </g>
    <!-- moon glow -->
    <circle cx="300" cy="58" r="22" fill="#F8E9C2" opacity=".9"/>
    <circle cx="300" cy="58" r="36" fill="#F8E9C2" opacity=".18"/>

    <!-- timecode pill -->
    <g transform="translate(248 22)" filter="url(#softShadow)">
      <rect width="116" height="28" rx="14" fill="rgba(20,20,20,.7)" stroke="rgba(255,255,255,.1)"/>
      <circle cx="14" cy="14" r="3" fill="#F26A6A"/>
      <text x="26" y="18" fill="#fff" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" font-weight="600">00:08.42</text>
    </g>
  </g>

  <!-- Transport bar -->
  <g transform="translate(0 304)">
    <rect width="390" height="56" fill="#1A1B1E"/>

    <!-- transport buttons -->
    <g fill="#EDEDF0">
      <g transform="translate(70 18)"><path d="M2 4 v12 M14 4 l-12 6 12 6 z" stroke="#EDEDF0" stroke-width="1.8" fill="#EDEDF0"/></g>
      <g transform="translate(102 18)" stroke="#EDEDF0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 6 a8 8 0 1 1 -8 8"/>
        <path d="M16 2 v6 h-6"/>
        <text x="8" y="14" fill="#EDEDF0" font-size="7" font-weight="700" font-family="ui-monospace, SF Mono, Menlo, monospace" stroke="none">5</text>
      </g>
      <!-- play -->
      <g transform="translate(174 7)" filter="url(#softShadow)">
        <circle cx="21" cy="21" r="21" fill="url(#violetBtn)"/>
        <path d="M17 13 l12 8 -12 8 z" fill="#fff"/>
      </g>
      <g transform="translate(238 18)" stroke="#EDEDF0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6 a8 8 0 1 0 8 8"/>
        <path d="M8 2 v6 h6"/>
        <text x="9" y="14" fill="#EDEDF0" font-size="7" font-weight="700" font-family="ui-monospace, SF Mono, Menlo, monospace" stroke="none">5</text>
      </g>
      <g transform="translate(270 18)"><path d="M14 4 v12 M2 4 l12 6 -12 6 z" stroke="#EDEDF0" stroke-width="1.8" fill="#EDEDF0"/></g>
    </g>

    <!-- zoom group -->
    <g transform="translate(304 14)">
      <rect width="74" height="28" rx="8" fill="#232428"/>
      <g transform="translate(8 8)" stroke="#9A9BA1" stroke-width="1.5" fill="none" stroke-linecap="round">
        <circle cx="6" cy="6" r="5"/>
        <path d="M3 6 h6"/>
        <path d="M10 10 l4 4"/>
      </g>
      <text x="37" y="19" text-anchor="middle" fill="#9A9BA1" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" font-weight="600">150%</text>
      <g transform="translate(54 8)" stroke="#9A9BA1" stroke-width="1.5" fill="none" stroke-linecap="round">
        <circle cx="6" cy="6" r="5"/>
        <path d="M3 6 h6 M6 3 v6"/>
        <path d="M10 10 l4 4"/>
      </g>
    </g>
  </g>

  <!-- Tool palette -->
  <g transform="translate(0 360)">
    <rect width="390" height="48" fill="#1A1B1E"/>
    <rect y="47" width="390" height="1" fill="rgba(255,255,255,.06)"/>

    <!-- Select (active) -->
    <g transform="translate(12 8)">
      <rect width="62" height="32" rx="6" fill="url(#violetBtn)"/>
      <path d="M14 10 l8 14 2 -5 5 -2 z" fill="#fff"/>
      <text x="40" y="21" fill="#fff" font-family="-apple-system, SF Pro Display, Segoe UI, sans-serif" font-size="10" font-weight="600">SELECT</text>
    </g>
    <!-- Tap -->
    <g transform="translate(80 8)">
      <rect width="52" height="32" rx="6" fill="#2C2D31"/>
      <circle cx="14" cy="16" r="4" fill="#FF8A4C"/>
      <text x="32" y="21" fill="#9A9BA1" font-family="-apple-system, SF Pro Display, Segoe UI, sans-serif" font-size="10" font-weight="600">TAP</text>
    </g>
    <!-- Beat -->
    <g transform="translate(138 8)">
      <rect width="58" height="32" rx="6" fill="#2C2D31"/>
      <rect x="9" y="11" width="10" height="10" rx="2" fill="#5BC0FF" transform="rotate(45 14 16)"/>
      <text x="34" y="21" fill="#9A9BA1" font-family="-apple-system, SF Pro Display, Segoe UI, sans-serif" font-size="10" font-weight="600">BEAT</text>
    </g>
    <!-- Hold -->
    <g transform="translate(202 8)">
      <rect width="58" height="32" rx="6" fill="#2C2D31"/>
      <rect x="9" y="12" width="12" height="8" rx="1.5" fill="#A879FF"/>
      <text x="34" y="21" fill="#9A9BA1" font-family="-apple-system, SF Pro Display, Segoe UI, sans-serif" font-size="10" font-weight="600">HOLD</text>
    </g>

    <!-- preview/clear -->
    <g transform="translate(316 8)">
      <rect width="28" height="32" rx="6" fill="#2C2D31"/>
      <circle cx="14" cy="16" r="6" fill="none" stroke="#A879FF" stroke-width="1.5"/>
      <path d="M12 13 l4 3 -4 3 z" fill="#A879FF"/>
    </g>
    <g transform="translate(350 8)">
      <rect width="28" height="32" rx="6" fill="#2C2D31"/>
      <path d="M10 14 h8 m-7 0 v6 a1 1 0 0 0 6 0 v-6" stroke="#9A9BA1" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Timeline -->
  <g transform="translate(0 408)">
    <!-- header column -->
    <rect width="64" height="298" fill="#1E1F22"/>
    <rect x="64" width="326" height="298" fill="#232428"/>

    <!-- ruler -->
    <g transform="translate(64 0)">
      <rect width="326" height="22" fill="#1E1F22"/>
      <g fill="#6B6C72" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9">
        <text x="6" y="14">0:00</text>
        <text x="66" y="14">0:01</text>
        <text x="126" y="14">0:02</text>
        <text x="186" y="14">0:03</text>
        <text x="246" y="14">0:04</text>
        <text x="306" y="14">0:05</text>
      </g>
      <!-- tick marks -->
      <g stroke="rgba(255,255,255,.12)" stroke-width="1">
        <line x1="0" y1="22" x2="0" y2="14"/>
        <line x1="60" y1="22" x2="60" y2="14"/>
        <line x1="120" y1="22" x2="120" y2="14"/>
        <line x1="180" y1="22" x2="180" y2="14"/>
        <line x1="240" y1="22" x2="240" y2="14"/>
        <line x1="300" y1="22" x2="300" y2="14"/>
      </g>
    </g>

    <!-- V1 label + film strip -->
    <g transform="translate(0 22)">
      <g transform="translate(0 0)">
        <rect width="64" height="40" fill="none"/>
        <g transform="translate(22 12)" fill="#9A9BA1">
          <path d="M2 0 h16 v12 h-16 z m1 1 v10 h2 v-10 z m12 0 v10 h2 v-10 z" />
        </g>
        <text x="32" y="34" text-anchor="middle" fill="#9A9BA1" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" font-weight="700">V1</text>
      </g>
      <rect x="64" width="326" height="40" fill="url(#filmStrip)"/>
      <rect x="64" y="39" width="326" height="1" fill="rgba(0,0,0,.5)"/>
      <!-- accent overlay -->
      <rect x="64" width="326" height="40" fill="#8C5CFF" opacity=".06"/>
    </g>

    <!-- TAP track -->
    <g transform="translate(0 62)">
      <g transform="translate(0 0)">
        <rect width="64" height="44" fill="none"/>
        <circle cx="32" cy="18" r="5" fill="#FF8A4C"/>
        <text x="32" y="38" text-anchor="middle" fill="#9A9BA1" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" font-weight="700">TAP</text>
      </g>
      <rect x="64" width="326" height="44" fill="#232428"/>
      <line x1="64" y1="43" x2="390" y2="43" stroke="rgba(0,0,0,.5)"/>
      <!-- events -->
      <circle cx="92" cy="22" r="9" fill="url(#orangeEvent)" filter="url(#softShadow)"/>
      <circle cx="148" cy="22" r="7" fill="url(#orangeEvent)" filter="url(#softShadow)"/>
      <circle cx="208" cy="22" r="10" fill="url(#orangeEvent)" filter="url(#softShadow)"/>
      <circle cx="248" cy="22" r="6" fill="url(#orangeEvent)" filter="url(#softShadow)"/>
      <circle cx="296" cy="22" r="8" fill="url(#orangeEvent)" filter="url(#softShadow)"/>
    </g>

    <!-- BEAT track -->
    <g transform="translate(0 106)">
      <g transform="translate(0 0)">
        <rect width="64" height="44" fill="none"/>
        <rect x="26" y="12" width="12" height="12" fill="#5BC0FF" transform="rotate(45 32 18)"/>
        <text x="32" y="38" text-anchor="middle" fill="#9A9BA1" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" font-weight="700">BEAT</text>
      </g>
      <rect x="64" width="326" height="44" fill="#232428"/>
      <line x1="64" y1="43" x2="390" y2="43" stroke="rgba(0,0,0,.5)"/>
      <!-- events -->
      <rect x="115" y="14" width="14" height="14" rx="3" fill="url(#cyanEvent)" transform="rotate(45 122 21)" filter="url(#softShadow)"/>
      <rect x="173" y="14" width="14" height="14" rx="3" fill="url(#cyanEvent)" transform="rotate(45 180 21)" filter="url(#softShadow)"/>
      <rect x="234" y="14" width="14" height="14" rx="3" fill="url(#cyanEvent)" transform="rotate(45 241 21)" filter="url(#softShadow)" />
      <rect x="299" y="14" width="14" height="14" rx="3" fill="url(#cyanEvent)" transform="rotate(45 306 21)" filter="url(#softShadow)" />
    </g>

    <!-- HOLD track -->
    <g transform="translate(0 150)">
      <g transform="translate(0 0)">
        <rect width="64" height="44" fill="none"/>
        <rect x="22" y="14" width="20" height="10" rx="2" fill="#A879FF"/>
        <text x="32" y="38" text-anchor="middle" fill="#9A9BA1" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" font-weight="700">HOLD</text>
      </g>
      <rect x="64" width="326" height="44" fill="#232428"/>
      <line x1="64" y1="43" x2="390" y2="43" stroke="rgba(0,0,0,.5)"/>
      <!-- continuous bars -->
      <rect x="78" y="12" width="38" height="20" rx="4" fill="url(#violetEvent)" filter="url(#softShadow)"/>
      <rect x="78" y="12" width="38" height="20" rx="4" fill="none" stroke="#A879FF" stroke-width="1"/>

      <rect x="156" y="14" width="56" height="16" rx="4" fill="url(#violetEvent)" filter="url(#softShadow)"/>
      <rect x="156" y="14" width="56" height="16" rx="4" fill="none" stroke="#A879FF" stroke-width="1"/>

      <rect x="248" y="11" width="76" height="22" rx="4" fill="url(#violetEvent)" filter="url(#softShadow)"/>
      <rect x="248" y="11" width="76" height="22" rx="4" fill="none" stroke="#A879FF" stroke-width="1"/>
    </g>

    <!-- Playhead -->
    <g>
      <line x1="190" y1="0" x2="190" y2="298" stroke="#F26A6A" stroke-width="1.5"/>
      <polygon points="184,22 196,22 190,32" fill="#F26A6A"/>
    </g>
  </g>

  <!-- Inspector -->
  <g transform="translate(0 706)">
    <rect width="390" height="138" fill="#1A1B1E"/>
    <rect width="390" height="1" fill="rgba(255,255,255,.06)"/>

    <!-- Header -->
    <g transform="translate(14 14)">
      <circle cx="4" cy="6" r="4" fill="#A879FF"/>
      <text x="14" y="11" fill="#EDEDF0" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" font-weight="700">CONTINUOUS</text>
      <text x="98" y="11" fill="#6B6C72" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10">@ 00:02.40</text>

      <!-- preview button -->
      <g transform="translate(254 -6)"><circle cx="13" cy="13" r="13" fill="rgba(140,92,255,.18)"/><path d="M10 8 l8 5 -8 5 z" fill="#A879FF"/></g>
      <!-- delete -->
      <g transform="translate(290 -6)"><circle cx="13" cy="13" r="13" fill="rgba(242,106,106,.18)"/><path d="M9 10 h8 m-7 0 v6 a1 1 0 0 0 6 0 v-6" stroke="#F26A6A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <!-- close -->
      <g transform="translate(326 -6)"><circle cx="13" cy="13" r="13" fill="#2C2D31"/><path d="M9 9 l8 8 m0 -8 l-8 8" stroke="#9A9BA1" stroke-width="1.5" stroke-linecap="round"/></g>
    </g>

    <!-- Sliders -->
    <g transform="translate(14 44)">
      <!-- intensity -->
      <g transform="translate(0 0)">
        <text x="0" y="10" fill="#6B6C72" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" font-weight="700">INTENSITY</text>
        <text x="106" y="10" text-anchor="end" fill="#A879FF" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" font-weight="700">82%</text>
        <rect x="0" y="18" width="106" height="8" rx="4" fill="#2C2D31"/>
        <rect x="0" y="18" width="87" height="8" rx="4" fill="#A879FF"/>
        <circle cx="87" cy="22" r="7" fill="#fff" filter="url(#softShadow)"/>
      </g>

      <!-- sharpness -->
      <g transform="translate(123 0)">
        <text x="0" y="10" fill="#6B6C72" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" font-weight="700">SHARPNESS</text>
        <text x="106" y="10" text-anchor="end" fill="#5BC0FF" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" font-weight="700">45%</text>
        <rect x="0" y="18" width="106" height="8" rx="4" fill="#2C2D31"/>
        <rect x="0" y="18" width="48" height="8" rx="4" fill="#5BC0FF"/>
        <circle cx="48" cy="22" r="7" fill="#fff" filter="url(#softShadow)"/>
      </g>

      <!-- duration -->
      <g transform="translate(246 0)">
        <text x="0" y="10" fill="#6B6C72" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" font-weight="700">DURATION</text>
        <text x="116" y="10" text-anchor="end" fill="#A879FF" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" font-weight="700">0.42s</text>
        <rect x="0" y="18" width="116" height="8" rx="4" fill="#2C2D31"/>
        <rect x="0" y="18" width="28" height="8" rx="4" fill="#A879FF"/>
        <circle cx="28" cy="22" r="7" fill="#fff" filter="url(#softShadow)"/>
      </g>
    </g>
  </g>

  <!-- home indicator -->
  <rect x="135" y="824" width="120" height="5" rx="2.5" fill="#EDEDF0" opacity=".6"/>
</svg>
